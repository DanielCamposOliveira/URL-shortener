<main class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Criar Conta</h2>
      <p>Preencha os dados para acessar a plataforma</p>
    </div>

    <form class="login-form" (ngSubmit)="RegistarUsuario()">
      <!-- Exibição de Erro -->
      @if (mensagemErro()) {
        <div class="error-message">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>{{ mensagemErro() }}</span>
        </div>
      }

      <!-- Campo Nome -->
      <div class="form-group">
        <label for="name">Nome</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input 
            type="text" 
            id="name" 
            [(ngModel)]="name" 
            name="name" 
            required 
            placeholder="Seu nome completo">
        </div>
      </div>

      <!-- Campo E-mail -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            required 
            placeholder="seuemail@exemplo.com">
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            required 
            placeholder="Sua senha">
        </div>
      </div>

      <!-- Botão Cadastrar -->
      <button type="submit" class="btn-submit" [disabled]="estaCarregando()">
        @if (estaCarregando()) {
          <i class="fa-solid fa-spinner fa-spin"></i> Criando conta...
        } @else {
          <i class="fa-solid fa-user-plus"></i> Cadastrar
        }
      </button>

      <!-- Botão Voltar para o Login -->
      <a routerLink="/login" class="btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Já tenho uma conta
      </a>
    </form>
  </div>
</main>
