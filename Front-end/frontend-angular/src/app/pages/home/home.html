<div class="dashboard-container">
  
  <main class="conteudo-principal">
    
    <!-- Área de Cadastro do Link -->
    <section class="shortener-box">
      <h3>Encurtar uma nova URL</h3>
      
      <!-- form do botao de cria url-->
      <form class="shortener-form" (ngSubmit)="onCriarUrl()">

        <div class="input-wrapper">
          <input 
            type="url" 
            placeholder="Cole seu link longo aqui (Ex: https://www.meusite.com/...)"
            [(ngModel)]="novaUrl"
            name="novaUrl"
            required
          />
        </div>
        
        <button type="submit" class="btn-primary">
          Encurtar Link
        </button>

      </form>
    </section>

    <!-- Tabela e Gerenciamento de URLs -->
    <div class="home-container">
      <h1>Gerenciador de URLs Encurtadas</h1>  
      
      @if (respostaApi) {
        <app-url-table
          [links]="listaDeLinks"
          [page]="respostaApi?.page || 1"
          [limit]="respostaApi?.limit || 10"
          [totalCount]="respostaApi?.totalCount || 0"
          (paginaAlterada)="carregarLinks($event)"
          (alternarStatus)="onAlternarStatus($event)"
          (excluirLink)="onExcluirLink($event)">
        </app-url-table>
      } @else {
        <p style="color: #666; font-style: italic; text-align: center; margin-top: 20px;">
          Carregando links do servidor...
        </p>
      }
    </div>

  </main>

</div>
