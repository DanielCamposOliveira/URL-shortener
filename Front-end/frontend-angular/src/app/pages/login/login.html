<!-- login.html -->
<div class="login-wrapper">
  <div class="login-card">
    <h2>Acessar Sistema</h2>
    <p>Bem-vindo de volta! Entre com suas credenciais.</p>

    <form (ngSubmit)="login()">
      <!-- Exibição de Erro -->
      @if (mensagemErro()) {
        <div class="error-message">{{ mensagemErro() }}</div>
      }

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="seu@email.com">
      </div>

      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" [(ngModel)]="senha" name="senha" required placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="estaCarregando()">
        {{ estaCarregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
